## COLORSCHEME: Gruvwood
set-option -g status "on"

# default statusbar color
set-option -g status-style "bg=#342e25,fg=#d5c4a1"

# default window title colors
set-window-option -g window-status-style "bg=#342e25,fg=#d5c4a1"

# default window with an activity alert
set-window-option -g window-status-activity-style "bg=#ff9f3f,fg=#2e2821,bold"

# active window title colors
set-window-option -g window-status-current-style "bg=#f28c38,fg=#2e2821,bold"

# pane border
set-option -g pane-active-border-style "fg=#96a542"
set-option -g pane-border-style "fg=#53483a"

# message infos
set-option -g message-style "bg=#453c30,fg=#ffb347"

# writing commands inactive
set-option -g message-command-style "bg=#453c30,fg=#bdca58"

# pane number display
set-option -g display-panes-active-colour "#bdca58"
set-option -g display-panes-colour "#756653"

set -g pane-border-status off

set -g mouse on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# clock
set-window-option -g clock-mode-colour "#bdca58"

# bell
set-window-option -g window-status-bell-style "bg=#f28c38,fg=#2e2821,bold"

## Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[bg=#342e25,fg=#bdca58,bold] #S "
set-option -g status-right "#[bg=#342e25,fg=#ffb347,nobold] %Y-%m-%d #[bg=#342e25,fg=#d5c4a1,bold] #h "

set-window-option -g window-status-current-format "#[bg=#f28c38,fg=#2e2821,bold] #W "
set-window-option -g window-status-format "#[bg=#342e25,fg=#d5c4a1] #I > #W "

# TERM exposed by tmux to local applications.
set -g default-terminal "screen-256color"

# The outer terminal is st; advertise its true-colour support to tmux.
set-option -sa terminal-features ",st-256color:RGB"
set-option -ga terminal-overrides ",st-256color:Tc"

# Preserve semantic ANSI blues inside tmux (NetHack BUC and messages).
set-option -g 'pane-colours[4]' '#5f7f8f'
set-option -g 'pane-colours[12]' '#83a598'

bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind-key -n C-l next-window
bind-key -n C-h previous-window
set-option -g focus-events on

bind G new-window "printf '\033]710:xft:Fira Code Retina:size=20\007'; exec \$SHELL"

# Let ST handle its own font zoom - just pass through keys
# ST has excellent built-in font zoom that doesn't break window size
